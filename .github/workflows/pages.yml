name: Publish production and preview
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Select authorized preview and reject obsolete runs
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('source/.github/preview.json', 'utf8'));
            const run = context.payload.workflow_run;
            if (!run) {
              if (context.ref !== 'refs/heads/main') throw new Error('Production dispatch requires main');
              core.setOutput('publish', 'true');
              return;
            }
            if (run.head_branch !== config.branch) {
              core.notice('Not the active preview branch; no publication');
              return;
            }
            const head = await github.rest.git.getRef({...context.repo, ref: `heads/${config.branch}`});
            if (head.data.object.sha !== run.head_sha) {
              core.notice('Obsolete successful run; retaining current publication');
              return;
            }
            core.setOutput('publish', 'true');
      - uses: actions/checkout@v4
        if: steps.select.outputs.publish == 'true'
        with:
          ref: pages-state
          path: site
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: steps.select.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Validate and build approved production source
        if: steps.select.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: source
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/download-artifact@v4
        if: steps.select.outputs.publish == 'true' && github.event_name == 'workflow_run'
        with:
          name: neon-drift-preview
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Assemble complete site
        if: steps.select.outputs.publish == 'true'
        env:
          MODE: ${{ github.event_name }}
          PREVIEW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node source/scripts/assemble-pages.mjs
      - uses: actions/configure-pages@v5
        if: steps.select.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.select.outputs.publish == 'true'
        with:
          path: publication
      - name: Deploy complete bundle
        id: deployment
        if: steps.select.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
      - name: Save successful publication state
        if: steps.select.outputs.publish == 'true'
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "Record successful Pages publication $GITHUB_RUN_ID"
          git push origin HEAD:pages-state
      - name: Play links
        if: steps.select.outputs.publish == 'true'
        run: |
          echo '### Play NEON-DRIFT' >> "$GITHUB_STEP_SUMMARY"
          echo '* [Production](https://reidmaxim.github.io/NEON-DRIFT/)' >> "$GITHUB_STEP_SUMMARY"
          echo '* [Experimental preview](https://reidmaxim.github.io/NEON-DRIFT/preview/)' >> "$GITHUB_STEP_SUMMARY"
