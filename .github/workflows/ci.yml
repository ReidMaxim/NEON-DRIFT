name: Validate
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build production candidate
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neon-drift-static
          path: dist
      - name: Build experimental preview
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: npm run build -- --base=/NEON-DRIFT/preview/
        env:
          VITE_PREVIEW: "true"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        with:
          name: neon-drift-preview
          path: dist
